name: Check My Sales Book
on:
  push:
    branches: [main, account-offline-upgrade]
  pull_request:
    branches: [main]
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Check inline JavaScript syntax
        run: python scripts/check_inline_js.py
