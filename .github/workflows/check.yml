name: Check Sellbook
on:
  push:
    branches: [main, account-offline-upgrade, "sellbook-live-location-v1"]
  pull_request:
    branches: [main]
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Check app assets, JavaScript syntax and DOM IDs
        run: python scripts/check_inline_js.py
      - name: Check live location module syntax
        run: node --check location-sharing.js
      - name: Check public release assets and browser secret boundaries
        run: node scripts/check_public_release.js
      - name: Check Sellbook brand name and tagline consistency
        run: node scripts/check_brand_identity.js
      - name: Test sales calculations, offline queue recovery and sync retries
        run: node scripts/check_sync_safety.js
      - name: Test business profile rendering and responsive content
        run: node scripts/check_business_profile_render.js
      - name: Test app-wide typography and spacing system
        run: node scripts/check_design_system.js
      - name: Test screen-by-screen app layout coverage
        run: node scripts/check_screen_layouts.js
      - name: Test sign-in and account recovery UI wiring
        run: node scripts/check_auth_experience.js
      - name: Test safe account and device backup restore
        run: node scripts/check_backup_restore.js
      - name: Test reversible product archiving and marketplace visibility
        run: node scripts/check_product_archive.js
      - name: Test audited sale corrections and stock returns
        run: node scripts/check_sale_reversals.js
      - name: Test first-use getting-started checklist
        run: node scripts/check_getting_started.js
      - name: Test admin console navigation, search and security wiring
        run: node scripts/check_admin_console.js
      - name: Test live-location isolation, freshness and CAPTCHA wiring
        run: node scripts/check_live_location.js
      - name: Check live-location disconnect cleanup migration
        shell: bash
        run: |
          set -euo pipefail
          migration="supabase/migrations/20261106091212_stop_location_sessions_when_shop_disconnects.sql"
          test -s "$migration"
          grep -q "security definer" "$migration"
          grep -q "set search_path to ''" "$migration"
          grep -q "after update of is_connected, is_active" "$migration"
          grep -q "status = 'stopped'" "$migration"
          grep -q "latitude = 0" "$migration"
          grep -q "longitude = 0" "$migration"
          grep -qi "revoke all on function public.stop_marketplace_location_sessions_when_shop_disconnects()" "$migration"
          grep -qi "from public, anon, authenticated" "$migration"
