name: Sellbook validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sellbook-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate app shell and JavaScript syntax
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact revision
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify required application files exist
        shell: bash
        run: |
          set -euo pipefail
          for file in index.html app.js styles.css sw.js manifest.webmanifest supabase-config.js; do
            test -s "$file" || { echo "Missing or empty required file: $file"; exit 1; }
          done

      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check sw.js
          node --check stock-history-tabs.js

      - name: Validate web app manifest JSON
        run: node -e "JSON.parse(require('node:fs').readFileSync('manifest.webmanifest', 'utf8')); console.log('Manifest JSON is valid')"

      - name: Check identity verification function syntax
        shell: bash
        run: |
          set -euo pipefail
          test -s supabase/functions/sellbook-identity/index.ts
          npx --yes esbuild@0.25.0 supabase/functions/sellbook-identity/index.ts --bundle --format=esm --external:jsr:* --external:npm:* --outfile=/tmp/sellbook-identity-check.js
          grep -q 'get_identity_verification_status' supabase/functions/sellbook-identity/index.ts
          grep -q 'begin_identity_verification_attempt' supabase/functions/sellbook-identity/index.ts
          grep -q 'claim_verified_identity' supabase/functions/sellbook-identity/index.ts
          grep -q 'crypto.subtle' supabase/functions/sellbook-identity/index.ts
          grep -q 'SELLBOOK_IDENTITY_LIVE_ENABLED' supabase/functions/sellbook-identity/index.ts
          grep -q 'duplicate_reference' supabase/functions/sellbook-identity/index.ts

      - name: Verify privacy-minimised identity schema
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'identity_fingerprint text not null unique' supabase/migrations/20261102160000_add_privacy_minimised_unique_identity_bindings.sql
          grep -q 'on delete cascade' supabase/migrations/20261102160000_add_privacy_minimised_unique_identity_bindings.sql
          grep -q 'grant execute on function public.claim_verified_identity' supabase/migrations/20261102160000_add_privacy_minimised_unique_identity_bindings.sql
          grep -q "Daily identity verification attempt limit reached" supabase/migrations/20261102162000_reserve_identity_attempts_with_atomic_rate_limit.sql
          grep -q 'pg_advisory_xact_lock' supabase/migrations/20261102162000_reserve_identity_attempts_with_atomic_rate_limit.sql
          grep -q 'grant execute on function public.begin_identity_verification_attempt' supabase/migrations/20261102162000_reserve_identity_attempts_with_atomic_rate_limit.sql
          ! grep -Eiq '^[[:space:]]*rollback[[:space:]]*;' supabase/migrations/20261102160000_add_privacy_minimised_unique_identity_bindings.sql
          ! grep -Eiq '^[[:space:]]*rollback[[:space:]]*;' supabase/migrations/20261102162000_reserve_identity_attempts_with_atomic_rate_limit.sql

      - name: Check key PWA metadata and cache version
        shell: bash
        run: |
          set -euo pipefail
          grep -q '<link rel="manifest" href="./manifest.webmanifest">' index.html
          grep -q 'display' manifest.webmanifest
          grep -Eq "const CACHE_NAME = 'sellbook-shell-v[0-9]+'" sw.js

      - name: Verify PIN gate wiring and migration safety
        shell: bash
        run: |
          set -euo pipefail
          grep -q "get_app_pin_status" app.js
          grep -q "set_app_pin" app.js
          grep -q "verify_app_pin" app.js
          grep -q "recheckSellbookPinStatus" app.js
          grep -q "armSecurityPinExpiry" app.js
          grep -q "securityPinCancel" index.html
          grep -q "securityPinExpiresAt" app.js
          grep -q "securityPinGate" index.html
          grep -q "sellbook-shell-v68" sw.js
          ! grep -Eiq '^[[:space:]]*rollback[[:space:]]*;' supabase/migrations/20261102143000_add_server_verified_sellbook_pin.sql
          grep -q 'enforce_sellbook_pin_before_write' supabase/migrations/20261102145000_gate_privileged_pin_write_paths.sql
          grep -q 'if not exists (' supabase/migrations/20261102145000_gate_privileged_pin_write_paths.sql
          grep -q 'from private.user_app_pins' supabase/migrations/20261102145000_gate_privileged_pin_write_paths.sql
          ! grep -Eiq '^[[:space:]]*rollback[[:space:]]*;' supabase/migrations/20261102145000_gate_privileged_pin_write_paths.sql
          grep -q "'expires_at',v_expires_at" supabase/migrations/20261102151500_expose_pin_expiry_and_strengthen_pin_rules.sql
          grep -q "Choose a less predictable six-digit PIN" supabase/migrations/20261102151500_expose_pin_expiry_and_strengthen_pin_rules.sql
          ! grep -Eiq '^[[:space:]]*rollback[[:space:]]*;' supabase/migrations/20261102151500_expose_pin_expiry_and_strengthen_pin_rules.sql
          grep -q "v_locked_until<=now()" supabase/migrations/20261102153000_reset_pin_attempts_after_lockout.sql
          ! grep -Eiq '^[[:space:]]*rollback[[:space:]]*;' supabase/migrations/20261102153000_reset_pin_attempts_after_lockout.sql
