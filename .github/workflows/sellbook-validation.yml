name: Sellbook validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sellbook-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate app shell and JavaScript syntax
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact revision
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify required application files exist
        shell: bash
        run: |
          set -euo pipefail
          for file in index.html app.js styles.css sw.js manifest.webmanifest supabase-config.js; do
            test -s "$file" || { echo "Missing or empty required file: $file"; exit 1; }
          done

      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check sw.js
          node --check stock-history-tabs.js

      - name: Validate web app manifest JSON
        run: node -e "JSON.parse(require('node:fs').readFileSync('manifest.webmanifest', 'utf8')); console.log('Manifest JSON is valid')"

      - name: Check identity verification function syntax
        shell: bash
        run: |
          set -euo pipefail
          test -s supabase/functions/sellbook-identity/index.ts
          npx --yes esbuild@0.25.0 supabase/functions/sellbook-identity/index.ts --bundle --format=esm --external:jsr:* --external:npm:* --outfile=/tmp/sellbook-identity-check.js
          grep -q 'get_identity_verification_status' supabase/functions/sellbook-identity/index.ts
          grep -q 'begin_identity_verification_attempt' supabase/functions/sellbook-identity/index.ts
          grep -q 'claim_and_finish_verified_identity' supabase/functions/sellbook-identity/index.ts
          grep -q 'crypto.subtle' supabase/functions/sellbook-identity/index.ts
          grep -q 'SELLBOOK_IDENTITY_LIVE_ENABLED' supabase/functions/sellbook-identity/index.ts
          grep -q 'SELLBOOK_IDENTITY_ENVIRONMENT' supabase/functions/sellbook-identity/index.ts
          grep -q 'SELLBOOK_IDENTITY_SANDBOX_ENABLED' supabase/functions/sellbook-identity/index.ts
          grep -q 'identityEnvironment !== "staging"' supabase/functions/sellbook-identity/index.ts
          grep -q 'identityEnvironment !== "production"' supabase/functions/sellbook-identity/index.ts
          grep -q 'sandbox_identity_checks_disabled' supabase/functions/sellbook-identity/index.ts
          grep -q 'Sandbox responses can be simulated and must never verify real production' supabase/functions/sellbook-identity/index.ts
          grep -q 'Do not activate the frontend identity gate while this function is undeployed' supabase/functions/sellbook-identity/README.md
          grep -q 'separate staging Supabase project' supabase/functions/sellbook-identity/README.md
          grep -q 'duplicate_reference' supabase/functions/sellbook-identity/index.ts

      - name: Verify privacy-minimised identity schema
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'identity_fingerprint text not null unique' supabase/migrations/20261102121054_add_privacy_minimised_unique_identity_bindings.sql
          grep -q 'on delete cascade' supabase/migrations/20261102121054_add_privacy_minimised_unique_identity_bindings.sql
          grep -q 'grant execute on function public.claim_verified_identity' supabase/migrations/20261102121054_add_privacy_minimised_unique_identity_bindings.sql
          grep -q "Daily identity verification attempt limit reached" supabase/migrations/20261102121454_reserve_identity_attempts_with_atomic_rate_limit.sql
          grep -q 'pg_advisory_xact_lock' supabase/migrations/20261102121454_reserve_identity_attempts_with_atomic_rate_limit.sql
          grep -q 'grant execute on function public.begin_identity_verification_attempt' supabase/migrations/20261102121454_reserve_identity_attempts_with_atomic_rate_limit.sql
          ! grep -Eiq '^[[:space:]]*rollback[[:space:]]*;' supabase/migrations/20261102121054_add_privacy_minimised_unique_identity_bindings.sql
          ! grep -Eiq '^[[:space:]]*rollback[[:space:]]*;' supabase/migrations/20261102121454_reserve_identity_attempts_with_atomic_rate_limit.sql

      - name: Verify private identity attempt access and retention
        shell: bash
        run: |
          set -euo pipefail
          test -s supabase/migrations/20261102131900_secure_identity_attempt_access_via_service_rpc.sql
          test -s supabase/migrations/20261102132311_fix_identity_attempt_finish_result_boolean.sql
          grep -q 'public.purge_identity_verification_attempts' supabase/migrations/20261102131900_secure_identity_attempt_access_via_service_rpc.sql
          grep -q 'public.attach_identity_liveness_session' supabase/migrations/20261102131900_secure_identity_attempt_access_via_service_rpc.sql
          grep -q 'public.get_identity_verification_attempt' supabase/migrations/20261102131900_secure_identity_attempt_access_via_service_rpc.sql
          grep -q 'public.finish_identity_verification_attempt' supabase/migrations/20261102131900_secure_identity_attempt_access_via_service_rpc.sql
          grep -q 'revoke all on function public.finish_identity_verification_attempt' supabase/migrations/20261102132311_fix_identity_attempt_finish_result_boolean.sql
          grep -q 'return coalesce(v_existing_state = p_state, false)' supabase/migrations/20261102132311_fix_identity_attempt_finish_result_boolean.sql
          grep -q 'purge_identity_verification_attempts' supabase/functions/sellbook-identity/index.ts
          grep -q 'attach_identity_liveness_session' supabase/functions/sellbook-identity/index.ts
          grep -q 'get_identity_verification_attempt' supabase/functions/sellbook-identity/index.ts
          grep -q 'finish_identity_verification_attempt' supabase/functions/sellbook-identity/index.ts
          test -s supabase/migrations/20261102153253_claim_and_finish_verified_identity_atomically.sql
          grep -q 'claim_and_finish_verified_identity' supabase/migrations/20261102153253_claim_and_finish_verified_identity_atomically.sql
          grep -q 'revoke all on function public.claim_and_finish_verified_identity' supabase/migrations/20261102153253_claim_and_finish_verified_identity_atomically.sql
          grep -q 'claim_and_finish_verified_identity' supabase/functions/sellbook-identity/index.ts
          grep -q 'attempt_finalized' supabase/functions/sellbook-identity/index.ts
          grep -q 'verification.type === "nin"' supabase/functions/sellbook-identity/index.ts
          grep -q 'verification.service === "nin_face_match"' supabase/functions/sellbook-identity/index.ts
          grep -q 'duplicateCheck?.status' supabase/functions/sellbook-identity/index.ts
          grep -q 'duplicateFaceStatus === "clear"' supabase/functions/sellbook-identity/index.ts
          grep -q 'duplicateFaceStatus === "returning"' supabase/functions/sellbook-identity/index.ts
          grep -q 'duplicateFaceStatus === "other_id"' supabase/functions/sellbook-identity/index.ts
          grep -q 'duplicateFaceStatus === "flagged"' supabase/functions/sellbook-identity/index.ts
          grep -q 'duplicate_face_check_unavailable' supabase/functions/sellbook-identity/index.ts
          grep -q 'identity_face_already_linked' supabase/functions/sellbook-identity/index.ts
          ! grep -q '.from("identity_verification_attempts")' supabase/functions/sellbook-identity/index.ts
          ! grep -q 'Access-Control-Allow-Origin: "*"' supabase/functions/sellbook-identity/index.ts

      - name: Verify complete permanent account deletion cleanup
        shell: bash
        run: |
          set -euo pipefail
          test -s supabase/migrations/20261102132753_allow_account_deletion_after_admin_notifications.sql
          grep -qi 'alter column created_by drop not null' supabase/migrations/20261102132753_allow_account_deletion_after_admin_notifications.sql
          grep -qi 'on delete set null' supabase/migrations/20261102132753_allow_account_deletion_after_admin_notifications.sql
          grep -q "const buckets=\['marketplace-product-images','product-images'\]" app.js
          grep -q "rpc('get_app_pin_status')" app.js
          grep -q 'pinExpiry<=Date.now()+10\*60\*1000' app.js
          grep -q "rpc('delete_my_account')" app.js
          grep -q 'offset+=pageFiles.length' app.js
          grep -q 'paths.slice(offset,offset+100)' app.js

      - name: Verify visit tracking is not redundantly triggered by admin navigation
        shell: bash
        run: |
          set -euo pipefail
          test "$(grep -Fc 'recordSellbookVisit();' app.js)" -eq 1

      - name: Verify admin data access requires a verified admin session
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "if(!supabaseClient||!cloudUser||!sellbookIsAdmin)return;" app.js
          test "$(grep -Fc "if(!supabaseClient||!cloudUser||!sellbookIsAdmin)return;" app.js)" -ge 5
          grep -Fq 'const expectedUserId=cloudUser?.id||null;' app.js
          grep -Fq 'if(cloudUser?.id!==expectedUserId)return false;' app.js
          grep -Fq 'if(cloudUser?.id===expectedUserId)setAdminAccess(false);' app.js
          grep -Fq 'setAdminAccess(false);' app.js
          grep -Fq 'let adminAccessEpoch=0;' app.js
          grep -Fq 'function adminRequestIsCurrent(userId,epoch)' app.js
          grep -Fq 'function clearAccountScopedUiState()' app.js
          grep -Fq 'messengerSelectedConversation=null;' app.js
          grep -Fq 'marketplaceReservationsCache=[];' app.js
          grep -Fq 'let adminConversationRequestId=0;' app.js
          grep -Fq 'if(adminConversationRequestId===requestId)adminConversationLoading=false;' app.js
          grep -Fq 'adminConversationRequestId++;' app.js
          grep -Fq 'if(!adminRequestIsCurrent(requestedUserId,requestEpoch))return;' app.js
          grep -Fq 'if(!supabaseClient||!cloudUser||!sellbookIsAdmin)return;' app.js
          grep -Fq 'if(!adminRequestIsCurrent(requestedUserId,requestEpoch))return;' app.js

      - name: Check key PWA metadata and cache version
        shell: bash
        run: |
          set -euo pipefail
          grep -q '<link rel="manifest" href="./manifest.webmanifest">' index.html
          grep -q 'display' manifest.webmanifest
          grep -Eq "const CACHE_NAME = 'sellbook-shell-v[0-9]+'" sw.js

      - name: Verify PIN gate wiring and migration safety
        shell: bash
        run: |
          set -euo pipefail
          grep -q "get_app_pin_status" app.js
          grep -q "set_app_pin" app.js
          grep -q "verify_app_pin" app.js
          grep -q "recheckSellbookPinStatus" app.js
          grep -q "armSecurityPinExpiry" app.js
          grep -q "securityPinCancel" index.html
          grep -q "securityPinExpiresAt" app.js
          grep -q "securityPinGate" index.html
          grep -q "sellbook-shell-v68" sw.js
          ! grep -Eiq '^[[:space:]]*rollback[[:space:]]*;' supabase/migrations/20261102114807_add_server_verified_sellbook_pin.sql
          grep -q 'enforce_sellbook_pin_before_write' supabase/migrations/20261102115450_gate_privileged_pin_write_paths.sql
          grep -q 'if not exists (' supabase/migrations/20261102115450_gate_privileged_pin_write_paths.sql
          grep -q 'from private.user_app_pins' supabase/migrations/20261102115450_gate_privileged_pin_write_paths.sql
          ! grep -Eiq '^[[:space:]]*rollback[[:space:]]*;' supabase/migrations/20261102115450_gate_privileged_pin_write_paths.sql
          grep -q "'expires_at',v_expires_at" supabase/migrations/20261102115954_expose_pin_expiry_and_strengthen_pin_rules.sql
          grep -q "Choose a less predictable six-digit PIN" supabase/migrations/20261102115954_expose_pin_expiry_and_strengthen_pin_rules.sql
          ! grep -Eiq '^[[:space:]]*rollback[[:space:]]*;' supabase/migrations/20261102115954_expose_pin_expiry_and_strengthen_pin_rules.sql
          grep -q "v_locked_until<=now()" supabase/migrations/20261102120333_reset_pin_attempts_after_lockout.sql
          ! grep -Eiq '^[[:space:]]*rollback[[:space:]]*;' supabase/migrations/20261102120333_reset_pin_attempts_after_lockout.sql
