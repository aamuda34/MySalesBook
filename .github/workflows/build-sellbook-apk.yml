name: Build Sellbook APK

on:
  workflow_dispatch:
  push:
    paths:
      - "sellbook-android/**"
      - ".github/workflows/build-sellbook-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        working-directory: sellbook-android
        run: gradle assembleDebug

      - name: Rename APK for easy identification
        run: cp sellbook-android/app/build/outputs/apk/debug/app-debug.apk sellbook-android/app/build/outputs/apk/debug/Sellbook.apk

      - name: Upload Sellbook APK
        uses: actions/upload-artifact@v4
        with:
          name: Sellbook-APK
          path: sellbook-android/app/build/outputs/apk/debug/Sellbook.apk
          if-no-files-found: error
          retention-days: 14
