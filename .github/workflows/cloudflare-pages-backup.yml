name: Cloudflare Pages backup

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: true

jobs:
  deploy-backup:
    name: Deploy Sellbook backup to Cloudflare Pages
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check out the exact GitHub revision
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Wrangler
        run: npm install --global wrangler@4

      - name: Normalize Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')"
          ACCOUNT="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')"
          if [[ -z "$TOKEN" || -z "$ACCOUNT" ]]; then
            echo "Cloudflare credentials are missing. Check the repository Actions secrets."
            exit 1
          fi
          echo "::add-mask::$TOKEN"
          {
            echo "CLOUDFLARE_API_TOKEN=$TOKEN"
            echo "CLOUDFLARE_ACCOUNT_ID=$ACCOUNT"
          } >> "$GITHUB_ENV"

      - name: Create the Pages project if it does not exist
        shell: bash
        run: |
          set -euo pipefail
          if ! wrangler pages project list --json | node -e '
            let s = "";
            process.stdin.on("data", d => s += d);
            process.stdin.on("end", () => {
              try {
                const projects = JSON.parse(s);
                process.exit(projects.some(p => p.name === "sellbook-backup") ? 0 : 1);
              } catch {
                process.exit(1);
              }
            });
          '; then
            wrangler pages project create sellbook-backup --production-branch main
          fi

      - name: Deploy the same Sellbook revision
        run: wrangler pages deploy . --project-name=sellbook-backup --branch=main
